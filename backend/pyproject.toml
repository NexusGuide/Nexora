[project]
name = "nexusvpn-backend"
version = "0.0.1"
description = "Nexus VPN backend API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert is expected in tests
    "B008",  # FastAPI dependencies are called in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # deterministic test secrets, clearly labelled

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
